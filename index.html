<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <!-- Local Font Awesome 6.5.2 styles. -->
    <link rel="stylesheet" href="./vendor/fontawesome/css/fontawesome.min.css">
    <link rel="stylesheet" href="./vendor/fontawesome/css/solid.min.css">
    <link rel="stylesheet" href="./vendor/fontawesome/css/regular.min.css">
    <!-- css file link  -->
    <link rel="stylesheet" href="./style.css">

</head>

<body>
    <!-- edit trans item form -->
    <div id="" class="edit-money-card">
        <div class="add-type">
            <p>Edit Expense</p>
            <button id="closeEdit" aria-label="Close edit form">
                <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
        </div>
        <div class="edit-form-container">
            <div class="flex-col edit-amount">
                <label for="editAmount">Amount</label>
                <input type="text" inputmode="decimal" name="amount" id="editAmount" required
                    pattern="(?:[1-9]\d*(?:\.\d+)?|0\.\d+)">
            </div>
            <div class="exp-for-edit flex-col">
                <label for="tagName">Tag Name</label>
                <input type="text" maxlength="20" id="tagName" required>
            </div>
        </div>
        <div class="info-container"><i class="fa-solid fa-circle-info" aria-hidden="true"></i>
            <p class="info"></p>
        </div>
        <button id="editTranBtn">Edit Expense <i class="fa-regular fa-pen-to-square" aria-hidden="true"></i></button>
    </div>

    <!-- mobie btn and greet user  -->
    <button class="mobile-add-btn" aria-label="Show expense form"><i class="fa-solid fa-plus" aria-hidden="true"></i></button>
    <div class="main">
        <div class="greeting">
            <p>Hi <h1>User,</h1>
            </p>
        </div>

        <!---------------------------- left section strats here  -------------------------->
        <div class="left-container">


            <div class="display-cards">
                
                <!-- money left card  -->
                <div class="money-left-card">
                    <div class="card-text-container">
                        <p>Budget Left</p>
                        <h1>
                            <select class="currency-selector" id="currencySelector">
                                <option value="¤">¤</option>
                                <option value="€">€</option>
                                <option value="kr">kr</option>
                                <option value="¥">¥</option>
                                <option value="$">$</option>
                                <option value="£">£</option>
                                <option value="₹">₹</option>
                                <option value="₱">₱</option>
                                <option value="₽">₽</option>
                                <option value="₪">₪</option>
                                <option value="₩">₩</option>
                                <option value="zł">zł</option>
                            </select><span id="budgetLeft">0</span>
                        </h1>
                    </div>
                    <div class="chart-container">
                        <canvas id="myChart"></canvas>
                    </div>
                </div>

                <!-- total money cards  -->
                <div class="budg-exp-container">

                    <div class="total-card total-budget">
                        <p>Total Budget</p>
                        <div>
                            <h4><span name="currency"></span><span id="totalBudget">0</span></h4>
                        </div>
                    </div>

                    <div class="total-card total-exp">
                        <p>Total Expense</p>
                        <div>
                            <h4><span name="currency"></span><span id="totalExp">0</span></h4>
                        </div>
                    </div>
                </div>


            </div>
            <!-- add exp or budget card  -->

            <div class="add-money-card">

                <div class="add-type">
                    <button class="add-exp-btn selected-add-exp">Add Expense</button>
                    <button class="add-bud-btn">Change Budget</button>
                </div>

                <div class="form-container">
                    <div class="flex-col add-amount">
                        <label for="addAmount">Amount</label>
                        <input type="text" inputmode="decimal" name="amount" id="addAmount" required
                            pattern="(?:[1-9]\d*(?:\.\d+)?|0\.\d+)">
                    </div>

                    <div class="exp-for">
                        <div class="tags-container">
                            <input type="radio" id="shopping" name="expFor" value="Shopping🛍️">
                            <label for="shopping">Shopping🛍️</label>
                            <input type="radio" id="food" name="expFor" value="Food😋">
                            <label for="food">Food😋</label>
                            <input type="radio" id="subscription" name="expFor" value="Subscription📱">
                            <label for="subscription">Subscription📱</label>
                        </div>
                        <div class="tag-input">
                            <input type="text" name="" maxlength="20" id="tagInputField" required>
                            <button id="confirmNewTag" aria-label="Confirm new tag"><i class="fa-solid fa-check" aria-hidden="true"></i></button>
                        </div>
                        <button id="addTagBtn">
                            Add tag <i class="fa-solid fa-plus" aria-hidden="true"></i>
                        </button>

                    </div>

                </div>
                <div class="info-container"><i class="fa-solid fa-circle-info" aria-hidden="true"></i>
                    <p class="info"></p>
                </div>

                <div class="add-money-card-btn">
                    <button id="addBtn">Add <i class="fa-solid fa-plus" aria-hidden="true"></i></button>
                    <button id="clearBtn">Clear</button>
                </div>


            </div>

        </div>
        <!------------------------------------ left section ends here  --------------------->




        <div class="right-container">
            <div class="history-text">
                <h1>History</h1>
                <select name="sortTrans" id="sortTrans">
                    <option value="default">Default</option>
                    <option value="highToLow">High to Low</option>
                    <option value="lowToHigh">Low to High</option>
                </select>
            </div>

            <div class="money-history-container">

            </div>
        </div>
    </div>



    <!-- Local Chart.js 4.5.1 build for offline use. -->
    <script src="./vendor/chart.umd.min.js"></script>

    <script src="./scripts/app.js" type="module"></script>

</body>

</html>
